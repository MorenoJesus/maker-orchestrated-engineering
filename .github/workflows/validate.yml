# Runs the repository's own reference checks. A green run shows that the schemas,
# synthetic fixtures, validator tests and slide build are consistent. It is not
# application verification, a release gate or MOE conformance evidence.
name: Validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Python ${{ matrix.python }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.10', '3.12', '3.14']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install pinned dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate reference records
        run: python scripts/validate.py
      - name: Run validator unit tests
        run: python -m unittest discover -s tests -v
      - name: Build presentation
        run: python scripts/build_slides.py
